[package]
name = "spi-benchmark"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"



embassy-executor = {
    version = "0.9",
    features = [
        "arch-cortex-m",
        "executor-thread",
        "defmt"
    ]
}

embassy-stm32 = {
    version = "0.4",
    features = [
        "stm32u585ai",
        "time-driver-any",
        "exti",
        "memory-x",
        "defmt"
    ]
}

embassy-time = {
    version = "0.5",
    features = [
        "defmt",
        "defmt-timestamp-uptime"
    ]
}

defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 1
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 3
overflow-checks = false